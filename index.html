<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ComerSys — Sistema de Gestión Comercial ERP. Inventario dinámico, clientes, ventas, financiación en cuotas y control comercial." />
  <title>ComerSys — Sistema de Gestión Comercial</title>

  <!-- Tipografía Profesional Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Hojas de Estilo Modulares CSS3 -->
  <link rel="stylesheet" href="css/variables.css?v=2.1" />
  <link rel="stylesheet" href="css/base.css?v=2.1" />
  <link rel="stylesheet" href="css/layout.css?v=2.1" />
  <link rel="stylesheet" href="css/components.css?v=2.1" />
  <link rel="stylesheet" href="css/modules.css?v=2.1" />
</head>
<body>

  <!-- ========================================================================
       1. PANTALLA DE AUTENTICACIÓN (LOGIN COMERSYS — RÉPLICA FIEL DE LA REFERENCIA)
       ======================================================================== -->
  <section id="auth-screen" class="auth-screen" aria-label="Inicio de sesión">
    <!-- LADO IZQUIERDO: Marca, Fotografía Profesional de Oficina y Eslogan -->
    <div class="cs-auth-left">
      <div class="cs-auth-left-bg" aria-hidden="true"></div>
      <div class="cs-auth-left-overlay" aria-hidden="true"></div>

      <!-- Divisor Curvo S en el borde derecho -->
      <svg class="cs-auth-curve-divider" viewBox="0 0 100 1000" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 100,0 L 100,1000 L 0,1000 C 25,850 45,700 65,500 C 80,350 92,180 100,0 Z" fill="#eef2fb" />
      </svg>

      <div class="cs-auth-left-content">
        <!-- Bloque Central: Logotipo + Nombre + Subtítulo -->
        <div class="cs-auth-brand-block">
          <div class="cs-auth-logo-wrap">
            <svg class="cs-auth-logo-svg" width="86" height="70" viewBox="0 0 88 72" fill="none" aria-hidden="true">
              <rect x="4" y="4" width="46" height="46" rx="14" stroke="#29b0fd" stroke-width="5.5" fill="rgba(41, 176, 253, 0.08)"/>
              <rect x="36" y="20" width="46" height="46" rx="14" stroke="#1d63dc" stroke-width="5.5" fill="rgba(29, 99, 220, 0.18)"/>
              <circle cx="37" cy="35" r="2.5" fill="#29b0fd"/>
            </svg>
          </div>
          <h1 class="cs-auth-brand-title">ComerSys</h1>
          <p class="cs-auth-brand-subtitle">Sistema de Gestión Comercial</p>
        </div>

        <!-- Frase Inferior y Barra Decorativa Celeste -->
        <div class="cs-auth-slogan-block">
          <p class="cs-auth-slogan-text">Tu negocio,<br>siempre en control</p>
          <div class="cs-auth-slogan-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <!-- LADO DERECHO: Tarjeta de Inicio de Sesión -->
    <div class="cs-auth-right">
      <div class="cs-auth-card">
        <h2 class="cs-auth-card-title">Iniciar sesión</h2>
        <p class="cs-auth-card-subtitle">Accedé a tu cuenta para continuar</p>

        <!-- Mensaje de error para JavaScript -->
        <div id="login-error-msg" class="cs-auth-error hidden" role="alert"></div>

        <form id="login-form" novalidate>
          <!-- Campo Usuario -->
          <div class="cs-auth-field">
            <div class="cs-auth-input-wrap">
              <span class="cs-auth-input-icon" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input
                type="text"
                id="login-username"
                class="cs-auth-input"
                value="administrador"
                placeholder="Usuario"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <!-- Campo Contraseña -->
          <div class="cs-auth-field">
            <div class="cs-auth-input-wrap">
              <span class="cs-auth-input-icon" aria-hidden="true">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="login-password"
                class="cs-auth-input has-toggle"
                value="admin123"
                placeholder="Contraseña"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                id="login-toggle-password"
                class="cs-auth-toggle-pass"
                aria-label="Mostrar u ocultar contraseña"
                title="Mostrar u ocultar contraseña"
              >
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Botón Ingresar -->
          <button type="submit" id="login-submit-btn" class="cs-auth-btn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            <span>Ingresar</span>
          </button>
        </form>

        <!-- Pie de la tarjeta -->
        <footer class="cs-auth-card-footer">
          <span>&copy; 2026 ComerSys</span>
        </footer>
      </div>
    </div>
  </section>

  <!-- ========================================================================
       2. ESTRUCTURA PRINCIPAL DE LA APLICACIÓN (SIDEBAR FIJO + HEADER + VISTAS)
       ======================================================================== -->
  <div id="app-shell" class="app-shell hidden">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Menú Lateral Fijo (Sidebar) -->
    <aside id="app-sidebar" class="app-sidebar" aria-label="Menú principal">
      <div class="sidebar-header">
        <div id="sidebar-brand-link" class="sidebar-brand">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect x="4" y="4" width="21" height="21" rx="5.5" stroke="#1D63DC" stroke-width="3.2" fill="rgba(29, 99, 220, 0.1)"/>
            <rect x="15" y="15" width="21" height="21" rx="5.5" stroke="#164DB2" stroke-width="3.2" fill="#1D63DC" fill-opacity="0.18"/>
            <circle cx="14.5" cy="14.5" r="2.2" fill="#1D63DC"/>
          </svg>
          <span class="sidebar-brand-name">ComerSys</span>
        </div>
        <button type="button" id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Cerrar menú">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-nav-section">Menú Principal</div>
        <button type="button" class="nav-item active" data-route="dashboard">
          <svg class="cs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
          <span>Inicio</span>
        </button>

        <button type="button" class="nav-item" data-route="inventory">
          <svg class="cs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          <span>Inventario</span>
        </button>

        <button type="button" class="nav-item" data-route="clients">
          <svg class="cs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Clientes</span>
        </button>

        <button type="button" class="nav-item" data-route="sales">
          <svg class="cs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
          <span>Ventas</span>
        </button>

        <button type="button" class="nav-item" data-route="debts">
          <svg class="cs-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><line x1="6" x2="10" y1="15" y2="15"/></svg>
          <span>Cuotas y Deudas</span>
          <span id="nav-debts-badge" class="nav-item-badge hidden">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-business-info">
          <div id="sidebar-business-name" class="sidebar-business-name">ComerSys</div>
        </div>
        <button type="button" id="sidebar-logout-btn" class="icon-action-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Área Principal (Header Superior + Contenedor de Módulos) -->
    <div class="app-main">
      <header class="app-header">
        <div class="header-left">
          <button type="button" id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Abrir menú">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
        </div>

        <div class="header-right">
          <div id="header-user-profile-btn" class="header-user-profile" style="cursor:default;">
            <div id="header-user-avatar" class="user-avatar-sm">AD</div>
            <div class="user-meta">
              <span id="header-user-name" class="user-meta-name">Administrador</span>
              <span id="header-user-role" class="user-meta-role">admin</span>
            </div>
          </div>
        </div>
      </header>

      <main id="app-content" class="app-content"></main>
    </div>
  </div>

  <!-- ========================================================================
       3. CARGA MODULAR DE SCRIPTS (VANILLA JS PURO — SIN FRAMEWORKS)
       ======================================================================== -->
  <!-- Núcleo y Arquitectura de Datos -->
  <script src="js/core/config.js?v=2.0"></script>
  <script src="js/core/storage.js?v=2.0"></script>
  <script src="js/core/api.js?v=2.0"></script>
  <script src="js/core/validators.js?v=2.0"></script>
  <script src="js/core/formatters.js?v=2.0"></script>
  <script src="js/core/demodata.js?v=2.0"></script>

  <!-- Capa de Servicios de Dominio -->
  <script src="js/services/auth.service.js?v=2.0"></script>
  <script src="js/services/inventory.service.js?v=2.0"></script>
  <script src="js/services/debts.service.js?v=2.0"></script>
  <script src="js/services/clients.service.js?v=2.0"></script>
  <script src="js/services/sales.service.js?v=2.0"></script>
  <script src="js/services/finance.service.js?v=2.0"></script>

  <!-- Componentes Visuales y Gráficos Vectoriales -->
  <script src="js/ui/icons.js?v=2.0"></script>
  <script src="js/ui/components.js?v=2.0"></script>
  <script src="js/ui/charts.js?v=2.0"></script>

  <!-- Módulos de Negocio Activos -->
  <script src="js/modules/dashboard.js?v=2.1"></script>
  <script src="js/modules/inventory.js?v=2.0"></script>
  <script src="js/modules/clients.js?v=2.0"></script>
  <script src="js/modules/sales.js?v=2.0"></script>
  <script src="js/modules/debts.js?v=2.0"></script>

  <!-- Inicializador Principal -->
  <script src="js/app.js?v=2.0"></script>
</body>
</html>
