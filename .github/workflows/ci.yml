name: ComerSys CI & Production Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Code Quality & Server Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar Sintaxis del Servidor
        run: |
          node -c server.js
          echo "Sintaxis de server.js verificada exitosamente."

      - name: Inicializar y Verificar Base de Datos (Template)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const templatePath = './data/comersys_platform.template.json';
            const dataPath = './data/comersys_platform.json';
            if (!fs.existsSync(dataPath) && fs.existsSync(templatePath)) {
              fs.copyFileSync(templatePath, dataPath);
            }
            let raw = fs.readFileSync(dataPath, 'utf8');
            if (raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
            const db = JSON.parse(raw);
            if (!db.superadmin || !db.superadmin.passwordHash) throw new Error('Cuenta SuperAdmin no encontrada');
            console.log('Base de datos multi-tenant inicializada e íntegra.');
          "

      - name: Ejecutar Suite Completa de Pruebas (38 Tests)
        run: npm test

      - name: Prueba de Arranque del Servidor en Producción
        run: |
          PORT=8000 node server.js &
          SERVER_PID=$!
          sleep 2
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/admin/ || exit 1
          kill $SERVER_PID
          echo "Pruebas de servidor superadas con éxito."
