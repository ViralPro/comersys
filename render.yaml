services:
  - type: web
    name: comersys-platform
    env: node
    plan: free
    buildCommand: "echo 'ComerSys Production Ready'"
    startCommand: "node server.js"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_PATH
        value: ./data/comersys_platform.json
      - key: ALLOWED_ORIGINS
        value: "*"
